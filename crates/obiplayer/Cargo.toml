[package]
name = "obiplayer"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
async-channel = "2.5.0"
obiplayer-core = { version = "0.1.0", path = "../obiplayer-core" }
relm4 = { version = "0.11.0", features = ["libadwaita", "gnome_46"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[target.'cfg(target_os = "linux")'.dependencies]
mpris-server = "0.11.0"
