[package]
name = "obiplayer-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
async-channel = "2.5.0"
realfft = "3.5.1"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "gzip", "query", "http2", "charset"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["net", "io-util", "time", "sync", "rt", "macros"] }
toml = "1.2.1"
tracing = "0.1.44"
unicode-normalization = "0.1.26"

[dev-dependencies]
async-channel = "2.5.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "test-util"] }
